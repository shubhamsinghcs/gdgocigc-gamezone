<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" fill="none">
  <!-- LEFT BRACKET (<) -->
  <g id="left-bracket">
    <!-- Blue Arm (Bottom Left) -->
    <line x1="250" y1="225" x2="355" y2="330" 
          stroke="#4285F4" stroke-width="65" stroke-linecap="round" />
    
    <!-- Red Arm (Top Left) -->
    <line x1="250" y1="225" x2="355" y2="120" 
          stroke="#EA4335" stroke-width="65" stroke-linecap="round" />

    <!-- Joint Overlap Shadow -->
    <circle cx="250" cy="225" r="32.5" fill="#000000" opacity="0.22" />
  </g>

  <!-- RIGHT BRACKET (>) -->
  <g id="right-bracket">
    <!-- Yellow Arm (Bottom Right) -->
    <line x1="550" y1="225" x2="445" y2="330" 
          stroke="#FBBC05" stroke-width="65" stroke-linecap="round" />
    
    <!-- Green Arm (Top Right) -->
    <line x1="550" y1="225" x2="445" y2="120" 
          stroke="#34A853" stroke-width="65" stroke-linecap="round" />

    <!-- Joint Overlap Shadow -->
    <circle cx="550" cy="225" r="32.5" fill="#000000" opacity="0.22" />
  </g>
</svg>
