<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0B0F17" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>GDGoC IGC Game Zone</title>
  <meta name="description" content="Official GDGoC IGC Game Zone - Real-time mobile-first tech trivia application featuring 10-second speed rounds, fastest finger bonuses, live synchronized leaderboard, and host controls." />
  <meta property="og:title" content="GDGoC IGC Game Zone" />
  <meta property="og:description" content="Official GDGoC IGC Game Zone - Real-time mobile-first tech trivia application featuring 10-second speed rounds, fastest finger bonuses, live synchronized leaderboard, and host controls." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Open+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            googleBlue: '#4285F4',
            googleRed: '#EA4335',
            googleYellow: '#FBBC05',
            googleGreen: '#34A853',
            slateSurface: '#161F30',
            slateDeep: '#0B0F17'
          },
          fontFamily: {
            sans: ['Outfit', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body class="bg-[#0B0F17] text-slate-100 app-viewport selection:bg-blue-500 selection:text-white">
  <!-- Root Container for Vanilla JS SPA Router -->
  <div id="app-root" class="app-viewport flex flex-col justify-between">
    <div class="w-full max-w-sm sm:max-w-xl md:max-w-3xl lg:max-w-4xl mx-auto px-4 sm:px-6 py-4">
      <!-- Top Navigation Header (Pure Inline Vector SVG) -->
      <header class="flex items-center justify-between w-full mx-auto relative z-10 pb-4 border-b border-slate-800/80 gap-2 sm:gap-4 safe-pad">
        <div class="flex items-center flex-1 justify-start min-w-0">
          <div class="header-logo">
            <svg viewBox="0 0 960 260" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto; display: block;">
              <!-- GDG CODE BRACKETS (< >) -->
              <g id="gdg-brackets">
                <!-- LEFT BRACKET (<) -->
                <line x1="425" y1="75" x2="458" y2="108" stroke="#4285F4" stroke-width="28" stroke-linecap="round" />
                <line x1="425" y1="75" x2="458" y2="42" stroke="#EA4335" stroke-width="28" stroke-linecap="round" />

                <!-- RIGHT BRACKET (>) -->
                <line x1="535" y1="75" x2="502" y2="108" stroke="#FBBC05" stroke-width="28" stroke-linecap="round" />
                <line x1="535" y1="75" x2="502" y2="42" stroke="#34A853" stroke-width="28" stroke-linecap="round" />
              </g>

              <!-- PRIMARY TEXT: Google Developer Groups -->
              <text x="480" y="172" 
                    text-anchor="middle" 
                    fill="#FFFFFF" 
                    font-family="'Google Sans', -apple-system, BlinkMacSystemFont, sans-serif" 
                    font-size="48" 
                    font-weight="500" 
                    letter-spacing="-0.5px">
                Google Developer Groups
              </text>

              <!-- SECONDARY TEXT: On Campus · Indo Global College -->
              <text x="480" y="218" text-anchor="middle" font-family="'Google Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="400">
                <tspan fill="#4285F4">On Campus</tspan>
                <tspan fill="#4285F4" font-weight="bold"> · </tspan>
                <tspan fill="#FFFFFF">Indo Global College</tspan>
              </text>
            </svg>
          </div>
        </div>
      </header>
    </div>
  </div>

  <!-- Main ES6 Module Entry Point -->
  <script type="module" src="./js/app.js"></script>

  <!-- Global Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none" role="status" aria-live="polite"></div>
</body>
</html>
